databases:
  - name: nakama-postgres
    databaseName: nakama
    user: postgres

services:
  # Nakama Game Server  
  - type: web
    name: nakama-server
    runtime: docker
    dockerfilePath: ./Dockerfile.nakama
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nakama-postgres
          property: connectionString
      - key: PORT
        value: 7350
      - key: NAKAMA_LOGGER_LEVEL
        value: INFO
    
  # Frontend Application
  - type: web  
    name: tic-tac-toe-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/build
    envVars:
      - key: REACT_APP_NAKAMA_HOST
        fromService:
          name: nakama-server
          type: web
          property: host
      - key: REACT_APP_NAKAMA_PORT
        value: 443
      - key: REACT_APP_NAKAMA_USE_SSL
        value: true
      - key: REACT_APP_NAKAMA_SERVER_KEY
        value: defaultkey