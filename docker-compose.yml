version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: nakama
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nakama"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nakama:
    image: heroiclabs/nakama:3.21.1
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        /nakama/nakama migrate up --database.address postgres:${POSTGRES_PASSWORD:-localdb}@postgres:5432/nakama &&
        exec /nakama/nakama --name nakama1 
        --database.address postgres:${POSTGRES_PASSWORD:-localdb}@postgres:5432/nakama 
        --logger.level INFO 
        --session.token_expiry_sec 7200 
        --metrics.prometheus_port 9100
        --runtime.http_key defaultkey
        --socket.server_key defaultkey
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./nakama/data/config.yml:/nakama/data/config.yml:ro
      - ./nakama/data/modules:/nakama/data/modules:ro
    ports:
      - "7349:7349"  # gRPC API
      - "7350:7350"  # HTTP API & WebSocket
      - "7351:7351"  # Console
    environment:
      - NAKAMA_DATABASE_ADDRESS=postgres:${POSTGRES_PASSWORD:-localdb}@postgres:5432/nakama
      - NAKAMA_LOGGER_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7350/"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_NAKAMA_HOST=localhost
      - REACT_APP_NAKAMA_PORT=7350
      - REACT_APP_NAKAMA_USE_SSL=false
      - REACT_APP_NAKAMA_SERVER_KEY=defaultkey
    depends_on:
      nakama:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local